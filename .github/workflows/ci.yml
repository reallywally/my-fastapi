name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  UV_FROZEN: '1'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-groups

      - name: ruff (lint)
        run: uv run ruff check .

      - name: ruff (format)
        run: uv run ruff format --check .

      # 규칙 #2, #9, #15 — 의존 방향은 문서가 아니라 린트로 존재한다 (§2.2)
      - name: import-linter
        run: uv run lint-imports

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-groups

      # testcontainers 가 Postgres/Redis 를 띄운다. 러너에 Docker 가 이미 있다.
      # --cov 는 pyproject 의 fail_under=70 을 그대로 적용한다 — 게이트는 이미 켜져 있다.
      - name: pytest
        run: uv run pytest --cov --cov-report=term-missing

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://app:app@localhost:5432/app
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-groups

      - name: alembic upgrade head
        run: uv run alembic upgrade head

      # 규칙 #4 — 모델과 마이그레이션이 어긋나면 실패한다 (§2.3)
      - name: alembic check
        run: uv run alembic check

      - name: downgrade 가능한지
        run: uv run alembic downgrade base
