name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  UV_FROZEN: '1'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-groups

      - name: ruff (lint)
        run: uv run ruff check .

      - name: ruff (format)
        run: uv run ruff format --check .

      # 규칙 #2, #9, #15 — 의존 방향은 문서가 아니라 린트로 존재한다 (§2.2)
      - name: import-linter
        run: uv run lint-imports

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-groups

      # 외부 서비스가 필요 없다. DB 는 임시 SQLite 파일, Redis 는 fakeredis.
      # --cov 는 pyproject 의 fail_under=70 을 그대로 적용한다.
      - name: pytest
        run: uv run pytest --cov --cov-report=term-missing

  migrations:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite+aiosqlite:///./var/ci.db
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-groups

      - name: alembic upgrade head
        run: uv run alembic upgrade head

      # 규칙 #4 — 모델과 마이그레이션이 어긋나면 실패한다 (§2.3)
      - name: alembic check
        run: uv run alembic check

      - name: downgrade 가능한지
        run: uv run alembic downgrade base
