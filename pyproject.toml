[project]
name = 'my-fastapi'
version = '0.1.0'
description = '게시판 API 서버'
readme = 'ARCHITECTURE.md'
requires-python = '>=3.12'
dependencies = [
    'fastapi>=0.115',
    'uvicorn[standard]>=0.32',
    'sqlalchemy[asyncio]>=2.0.36',
    'asyncpg>=0.30',
    'alembic>=1.14',
    'pydantic>=2.10',
    'pydantic-settings>=2.7',
    'redis>=5.2',
]

[dependency-groups]
dev = [
    'pytest>=8.3',
    'pytest-asyncio>=0.25',
    'pytest-cov>=6.0',
    'httpx>=0.28',
    'testcontainers[postgres,redis]>=4.9',
    'ruff>=0.9',
    'import-linter>=2.1',
    'pre-commit>=4.0',
]

[build-system]
requires = ['hatchling']
build-backend = 'hatchling.build'

[tool.hatch.build.targets.wheel]
packages = ['src/app']

# ---------------------------------------------------------------- ruff (§1.5)

[tool.ruff]
line-length = 120
target-version = 'py312'
src = ['src', 'tests']
# 설계 문서의 코드블록은 실행 코드가 아니라 예시다. 포매터가 손대면 대비가 무너진다.
extend-exclude = ['*.md']

[tool.ruff.format]
quote-style = 'single'

[tool.ruff.lint]
select = [
    'F', 'E', 'W',     # pyflakes / pycodestyle
    'I',               # isort
    'N',               # pep8-naming
    'UP',              # pyupgrade
    'ANN',             # 타입 힌트 강제 (§1.5)
    'ASYNC',           # async 안티패턴
    'S',               # bandit
    'B',               # bugbear
    'A',               # builtin shadowing
    'C4',              # comprehensions
    'C90',             # mccabe 복잡도
    'DTZ',             # naive datetime 금지
    'T20',             # print 금지
    'PT',              # pytest 스타일
    'SIM',             # 단순화
    'TID',             # 상대 import 금지
    'ARG',             # 미사용 인자
    'PTH',             # os.path 대신 pathlib
    'PL',              # pylint
    'RUF',
]
ignore = [
    'ANN401',   # 드물게 Any 가 정답인 자리가 있다
    'PLR0913',  # 인자 개수는 키워드 전용 인자 규약으로 관리한다
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = 'all'

[tool.ruff.lint.isort]
known-first-party = ['app']

[tool.ruff.lint.per-file-ignores]
'tests/**' = ['S101', 'ANN', 'ARG', 'PLR2004', 'S603', 'S607']
'migrations/**' = ['ANN', 'ERA', 'INP001']

# -------------------------------------------------------------- pytest (§2.8)

[tool.pytest.ini_options]
asyncio_mode = 'auto'
asyncio_default_fixture_loop_scope = 'session'
testpaths = ['tests']
addopts = '-q --strict-markers --strict-config'

# ------------------------------------------------------------ coverage (§2.8)
# 게이트를 CI 에서 켜는 것은 Phase 6. 여기서는 기준선만 박아둔다.

[tool.coverage.run]
source = ['src/app']
branch = true

[tool.coverage.report]
fail_under = 70
show_missing = true
exclude_also = ['if TYPE_CHECKING:', 'raise NotImplementedError']
