# 로컬 개발용 자원. **DB 는 여기 없다** — SQLite 는 파일이라 띄울 서버가 없다.
#
# `migrate` → `api` 순서를 보장하는 배포용 서비스는 Phase 6 에서 추가한다 (§2.3, §6).
# 앱은 여기서 돌리지 않는다:
#     uv run alembic upgrade head
#     uv run uvicorn app.main:app --reload

services:
  redis:
    image: redis:7-alpine
    ports: ['6379:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10
